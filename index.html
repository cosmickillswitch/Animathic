<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121218">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Animath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="./" aria-label="Animath"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" rx="44" fill="#000000"/><path d="M30 150 C 60 150 70 50 100 50 C 130 50 140 150 170 150" fill="none" stroke="#58C4DD" stroke-width="12" stroke-linecap="round"/><circle cx="100" cy="50" r="14" fill="#FFFF00"/><path d="M30 168 H170" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".55"/></svg><b>Animath</b></a>
  <select id="proj" aria-label="Project"></select>
  <button id="menuBtn" class="iconbtn" type="button" aria-label="Projects">⋯</button>
  <span class="grow"></span>
  <button id="aspectBtn" class="aspectbtn" type="button" aria-label="Video shape">16:9 ▾</button>
  <button id="exportBtn" class="btn primary" type="button">Export</button>
</header>
<div id="col" class="col">
  <div id="stageWrap"><canvas id="stage" aria-label="Animation preview"></canvas></div>
  <div class="transport">
    <span class="time"><span id="time">0:00.0</span> <span>/ <span id="dur">0:00.0</span></span></span>
    <span class="grow"></span>
    <button id="toStart" class="iconbtn" type="button" aria-label="Back to start">⏮</button>
    <button class="playbtn" type="button" aria-label="Play">▶</button>
    <button id="loopBtn" class="iconbtn tog" type="button" aria-pressed="false" aria-label="Loop playback" title="Loop">↻</button>
    <span class="grow"></span>
    <button id="guides" class="iconbtn tog" type="button" aria-pressed="false" aria-label="Coordinate grid" title="Grid">⌗</button>
    <button id="undo" class="iconbtn" type="button" aria-label="Undo" title="Undo">↶</button>
    <button id="redo" class="iconbtn" type="button" aria-label="Redo" title="Redo">↷</button>
  </div>
  <section id="timeline" class="tl" aria-label="Timeline"></section>
  <nav id="tools" class="tools" aria-label="Tools"></nav>
</div>
<aside id="sheet" class="sheet" hidden aria-label="Panel">
  <div class="sheet-head"><button class="playbtn small" type="button" aria-label="Play">▶</button><b id="sheetTitle"></b><button id="sheetClose" class="iconbtn" type="button" aria-label="Close panel">✕</button></div>
  <div id="sheetBody" class="sheet-body"></div>
</aside>
<dialog id="exportDlg" aria-label="Export"></dialog>
<dialog id="menuDlg" aria-label="Projects"></dialog>

<script src="core.js"></script>
<script src="editor.js"></script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
